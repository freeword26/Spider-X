services:
  worker-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spider-x-api
    restart: always
    ports:
      - "8006:8006"
    environment:
      - RABBITMQ_HOST=host.docker.internal
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6383
      - SPIDER_X_API_PORT=8006
      - TZ=Asia/Shanghai
      # ── 角色引擎 ──
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_API_BASE=https://api.openai.com/v1
      - LLM_API_KEY=
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./spider_x:/app/spider_x:ro
      - ./config:/app/config:ro
      - ./roles.yaml:/app/roles.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker-node:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    environment:
      - RABBITMQ_HOST=host.docker.internal
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6383
      - NODE_TYPE=worker
      - TZ=Asia/Shanghai
      # ── 角色引擎 ──
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_API_KEY=
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./spider_x:/app/spider_x:ro
      - ./config:/app/config:ro
      - ./roles.yaml:/app/roles.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: 2
