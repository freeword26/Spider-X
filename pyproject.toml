[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-x"
version = "1.0.0"
description = "蜘蛛群 - Worker智能体集群引擎 | Spider Swarm Worker Agent Cluster Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Spider-X Team"}]
keywords = ["spider", "agent", "cluster", "worker", "orchestration", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "aio-pika>=9.3.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0", "opentelemetry-exporter-otlp-proto-http>=1.20.0"]
neo4j = ["neo4j>=5.0.0"]
redis = ["redis>=5.0.0"]
all = ["spider-x[otel,neo4j,redis]"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0"]

[project.scripts]
spider-x = "spider_x.cli:main"

[tool.setuptools.packages.find]
include = ["spider_x*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
