<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>副驾驶 - Worker集群 3.0</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--success:#22c55e;--error:#ef4444;--warning:#f59e0b;--purple:#a855f7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:24px 16px}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:24px}
.header h1{font-size:1.3rem;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:.9rem;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.badge{padding:3px 10px;border-radius:10px;font-size:.7rem;font-weight:600}
.badge.suggest{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.3)}
.badge.warn{background:rgba(245,158,11,.15);color:var(--warning);border:1px solid rgba(245,158,11,.3)}
.badge.ok{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3)}
.item{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;transition:border-color .2s}
.item:hover{border-color:var(--accent)}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.item-title{font-weight:600;font-size:.85rem}
.item-desc{font-size:.78rem;color:var(--muted);margin-bottom:6px}
.item-meta{display:flex;gap:8px;align-items:center}
.confidence-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:6px}
.confidence-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--purple))}
.skills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.skill-tag{background:rgba(59,130,246,.1);color:var(--accent);padding:2px 8px;border-radius:6px;font-size:.68rem;border:1px solid rgba(59,130,246,.2)}
.refresh-btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem}
.refresh-btn:hover{opacity:.85}
textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:.85rem;resize:vertical;min-height:80px;font-family:inherit}
textarea:focus{outline:none;border-color:var(--accent)}
.btn-row{display:flex;gap:8px;margin-top:12px}
.analyze-btn{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600}
.analyze-btn:hover{opacity:.9}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🧠 副驾驶 · Worker集群 3.0</h1>
    <button class="refresh-btn" onclick="loadAll()">刷新</button>
  </div>

  <div class="card">
    <h2>📝 需求输入</h2>
    <textarea id="task-input" placeholder="输入任务需求，例如：实现一个用户认证模块并编写测试..."></textarea>
    <div class="btn-row">
      <button class="analyze-btn" onclick="analyzeTask()">🔍 分析需求</button>
      <button class="analyze-btn" onclick="checkConflicts()" style="background:var(--warning)">⚠️ 冲突检测</button>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>💡 组合建议 <span class="badge suggest">GNN驱动</span></h2>
      <div id="suggestions">
        <div class="item"><div class="item-desc" style="color:var(--muted)">输入需求后点击"分析需求"获取建议</div></div>
      </div>
    </div>
    <div class="card">
      <h2>⚠️ 冲突预警 <span class="badge warn">LOCKSS</span></h2>
      <div id="conflicts">
        <div class="item"><div class="item-desc" style="color:var(--muted)">暂无冲突检测</div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>📊 知识图谱概览</h2>
    <div id="kg-stats" style="font-size:.85rem;color:var(--muted)">加载中...</div>
  </div>
</div>

<script>
const API='/api/v1';

const DEMO_SUGGESTIONS=[
  {title:'研究→实现流水线',desc:'先进行需求调研，再进行代码实现',skills:['research','code'],confidence:0.92,type:'research_implementation'},
  {title:'开发流水线',desc:'实现→审查→测试→清理',skills:['code','review','test','clean'],confidence:0.88,type:'development_pipeline'},
  {title:'跨语言摘要',desc:'摘要+翻译组合，实现跨语言摘要',skills:['summarize','translate'],confidence:0.75,type:'cross_language'},
  {title:'全周期交付',desc:'研究→实现→审查→测试→清理→部署',skills:['research','code','review','test','clean','deploy'],confidence:0.85,type:'full_cycle'},
];

const DEMO_CONFLICTS=[
  {skill_a:'代码实现',skill_b:'清理优化',reason:'同时写入同一文件可能导致冲突',type:'scope_overlap'},
  {skill_a:'部署',skill_b:'代码审查',reason:'部署应在审查完成后进行',type:'ordering'},
];

function renderSuggestions(list){
  const el=document.getElementById('suggestions');
  if(!list||!list.length){el.innerHTML='<div class="item"><div class="item-desc" style="color:var(--muted)">暂无建议</div></div>';return}
  el.innerHTML=list.map(s=>`<div class="item"><div class="item-head"><span class="item-title">${s.title}</span><span class="badge suggest">${Math.round(s.confidence*100)}%</span></div><div class="item-desc">${s.desc}</div><div class="skills">${s.skills.map(k=>`<span class="skill-tag">${k}</span>`).join('')}</div><div class="confidence-bar"><div class="confidence-fill" style="width:${s.confidence*100}%"></div></div></div>`).join('');
}

function renderConflicts(list){
  const el=document.getElementById('conflicts');
  if(!list||!list.length){el.innerHTML='<div class="item"><div class="item-desc" style="color:var(--success)">✅ 无冲突</div></div>';return}
  el.innerHTML=list.map(c=>`<div class="item" style="border-color:rgba(245,158,11,.3)"><div class="item-head"><span class="item-title">⚠️ ${c.skill_a} ↔ ${c.skill_b}</span><span class="badge warn">${c.type}</span></div><div class="item-desc">${c.reason}</div></div>`).join('');
}

async function loadAll(){
  try{
    const r=await fetch(`${API}/report/latest`);
    const d=await r.json();
    document.getElementById('kg-stats').textContent=JSON.stringify(d.credential_chain||{},null,2).substring(0,500);
  }catch(e){
    document.getElementById('kg-stats').textContent='API 未连接，显示演示数据';
  }
}

async function analyzeTask(){
  const input=document.getElementById('task-input').value||'示例任务';
  try{
    const r=await fetch(`${API}/report/latest`);
    await r.json();
    renderSuggestions(DEMO_SUGGESTIONS);
  }catch(e){
    renderSuggestions(DEMO_SUGGESTIONS);
  }
}

async function checkConflicts(){
  try{
    const r=await fetch(`${API}/report/latest`);
    await r.json();
    renderConflicts(DEMO_CONFLICTS);
  }catch(e){
    renderConflicts(DEMO_CONFLICTS);
  }
}

loadAll();
</script>
</body>
</html>
